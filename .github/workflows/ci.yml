name: CI

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          xcodebuild build \
            -project hypr.xcodeproj \
            -scheme hypr \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
